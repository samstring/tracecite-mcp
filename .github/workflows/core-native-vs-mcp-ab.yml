name: Core Native vs TraceCite MCP A/B

on:
  push:
    branches: [feature_for_agent]
    paths:
      - .github/workflows/core-native-vs-mcp-ab.yml
      - skills/tracecite/**
      - src/tracecite_mcp/**
  workflow_dispatch:
    inputs:
      scope:
        description: "smoke = 140039; standard = 140039 + 140848; 140268 = hard case; all = all three"
        required: true
        default: standard
        type: choice
        options:
          - smoke
          - standard
          - 140268
          - all
      core_ref:
        description: "TraceCite Core ref under test"
        required: true
        default: experiment/evidence-intelligence
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      core_ref: ${{ steps.core.outputs.value }}
    steps:
      - id: core
        shell: bash
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.core_ref || 'experiment/evidence-intelligence' }}
        run: echo "value=$REQUESTED" >> "$GITHUB_OUTPUT"
      - id: matrix
        env:
          SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'smoke' }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cases = {
              "140039": {
                  "case_id": "kubernetes-140039-runc-5347-log-code",
                  "case_dir": "benchmarks/agent-investigation/log-code-cases/kubernetes-140039-runc-5347",
                  "arm_order": "native tracecite",
              },
              "140848": {
                  "case_id": "kubernetes-140848-log-code",
                  "case_dir": "benchmarks/agent-investigation/log-code-cases/kubernetes-140848",
                  "arm_order": "native tracecite",
              },
              "140268": {
                  "case_id": "kubernetes-140268-log-code",
                  "case_dir": "benchmarks/agent-investigation/log-code-cases/kubernetes-140268",
                  "arm_order": "tracecite native",
              },
          }
          scope = os.environ["SCOPE"]
          selected = {
              "smoke": [cases["140039"]],
              "standard": [cases["140039"], cases["140848"]],
              "140268": [cases["140268"]],
              "all": [cases["140039"], cases["140848"], cases["140268"]],
          }.get(scope)
          if selected is None:
              raise SystemExit(f"unknown scope: {scope}")
          print("value=" + json.dumps({"include": selected}, separators=(",", ":")))
          PY

  compare:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL || 'MiniMaxAI/MiniMax-M3' }}
      PI_CODING_AGENT_DIR: /tmp/pi-agent-config
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CORE_REF: ${{ needs.plan.outputs.core_ref }}
      CASE_ID: ${{ matrix.case_id }}
      CASE_REL: ${{ matrix.case_dir }}
      RESULT_ROOT: /tmp/core-native-vs-mcp/${{ matrix.case_id }}/r1
      PREP: /tmp/core-native-vs-mcp/${{ matrix.case_id }}/r1/prepared
      WORK_ROOT: /tmp/core-native-vs-mcp/${{ matrix.case_id }}/r1/workspace
      SOURCE_ROOT: /tmp/core-native-vs-mcp/${{ matrix.case_id }}/r1/workspace/source
      ARM_ORDER: ${{ matrix.arm_order }}

    steps:
      - name: Checkout TraceCite MCP product transport
        uses: actions/checkout@v4

      - name: Checkout TraceCite Core under test
        uses: actions/checkout@v4
        with:
          repository: samstring/tracecite-core
          ref: ${{ env.CORE_REF }}
          path: core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve benchmark paths and SHAs
        shell: bash
        run: |
          set -euo pipefail
          echo "CASE_DIR=$GITHUB_WORKSPACE/core/$CASE_REL" >> "$GITHUB_ENV"
          echo "MCP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CORE_SHA=$(git -C core rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install current Core, MCP, Pi, and MCP adapter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e "./core[dev]"
          python -m pip install 'mcp>=2,<3'
          python -m pip install -e . --no-deps
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          mkdir -p "$PI_CODING_AGENT_DIR"
          pi install npm:pi-mcp-adapter@2.27.0 --approve
          python - <<'PY'
          import inspect
          from pathlib import Path
          import tracecite
          import tracecite_mcp
          workspace = Path.cwd().resolve()
          core_path = Path(inspect.getfile(tracecite)).resolve()
          mcp_path = Path(inspect.getfile(tracecite_mcp)).resolve()
          if workspace / 'core' not in core_path.parents:
              raise SystemExit(f'MCP did not resolve checked-out Core under test: {core_path}')
          if workspace not in mcp_path.parents:
              raise SystemExit(f'wrong MCP checkout imported: {mcp_path}')
          print(f'core={core_path}')
          print(f'mcp={mcp_path}')
          PY

      - name: Verify product and benchmark contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_projection.py tests/test_server.py tests/test_stdio_integration.py
          cd core
          python -m pytest -q \
            tests/test_session_novelty_regressions.py \
            tests/test_pi_session_to_transcript.py \
            tests/test_root_cause_benchmarking.py \
            tests/test_support_aware_root_cause_benchmarking.py \
            tests/test_benchmark_run_result.py \
            tests/test_log_code_score.py \
            tests/test_pi_mcp_benchmark_boundary.py
          python scripts/check_architecture.py
          python -m tracecite.root_cause_benchmarking validate "$CASE_DIR"

      - name: Configure model
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "OPENAI_API_KEY is not configured in tracecite-mcp Actions secrets" >&2
            exit 2
          fi
          mkdir -p "$PI_CODING_AGENT_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {'providers': {'gmi': {
              'name': 'GMI OpenAI-compatible',
              'baseUrl': os.environ['OPENAI_BASE_URL'],
              'api': 'openai-completions',
              'models': [{
                  'id': os.environ['BENCH_MODEL'],
                  'name': os.environ['BENCH_MODEL'],
                  'reasoning': False,
                  'input': ['text'],
                  'cost': {'input': 0, 'output': 0, 'cacheRead': 0, 'cacheWrite': 0},
                  'contextWindow': 1_000_000,
                  'maxTokens': 4_096,
                  'compat': {'supportsDeveloperRole': False, 'supportsReasoningEffort': False},
              }],
          }}}
          (Path(os.environ['PI_CODING_AGENT_DIR']) / 'models.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Prepare failing runtime log
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT_ROOT"
          mkdir -p "$RESULT_ROOT" "$PREP" "$WORK_ROOT/evidence"
          python -m tracecite.root_cause_benchmarking prepare "$CASE_DIR" --work-dir "$PREP" > "$RESULT_ROOT/prepare.json"
          PREPARED="$(find "$PREP" -name prepared.json -type f -print -quit)"
          test -n "$PREPARED"
          python - "$PREPARED" >> "$GITHUB_ENV" <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          inputs = data.get('inputs') or []
          if len(inputs) != 1:
              raise SystemExit(f'expected exactly one runtime log input, got {len(inputs)}')
          source = Path(inputs[0]['path']).resolve()
          target = Path(os.environ['WORK_ROOT']) / 'evidence' / source.name
          shutil.copyfile(source, target)
          print(f'RUNTIME_LOG={target.resolve()}')
          print(f'RUNTIME_LOG_BYTES={target.stat().st_size}')
          print(f'QUESTION_FILE={Path(data["question"]).resolve()}')
          PY

      - name: Checkout complete pre-fix source repository
        shell: bash
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json, os, shlex
          from pathlib import Path
          case = json.loads((Path(os.environ['CASE_DIR']) / 'case.json').read_text())
          source = case['source_checkout']
          print('SOURCE_REPOSITORY=' + shlex.quote(source['repository']))
          print('SOURCE_COMMIT=' + shlex.quote(source['commit']))
          PY
          )"
          {
            echo "SOURCE_REPOSITORY=$SOURCE_REPOSITORY"
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
          } >> "$GITHUB_ENV"
          rm -rf "$SOURCE_ROOT"
          git init -q "$SOURCE_ROOT"
          git -C "$SOURCE_ROOT" remote add origin "$SOURCE_REPOSITORY"
          git -C "$SOURCE_ROOT" fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C "$SOURCE_ROOT" checkout -q --detach FETCH_HEAD
          test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C "$SOURCE_ROOT" remote remove origin
          python - <<'PY'
          import json, os
          from pathlib import Path
          case = json.loads((Path(os.environ['CASE_DIR']) / 'case.json').read_text())
          source = case['source_checkout']
          root = Path(os.environ['SOURCE_ROOT'])
          for assertion in source.get('pre_fix_assertions') or []:
              path = root / assertion['path']
              text = path.read_text(encoding='utf-8', errors='replace')
              required = assertion.get('contains')
              forbidden = assertion.get('not_contains')
              if required and required not in text:
                  raise SystemExit(f"pre-fix assertion missing in {path}: {required}")
              if forbidden and forbidden in text:
                  raise SystemExit(f"post-fix source leaked in {path}: {forbidden}")
          PY
          printf '%s\n' "$SOURCE_COMMIT" > "$RESULT_ROOT/source-commit.txt"
          printf '%s\n' "$CORE_SHA" > "$RESULT_ROOT/core-sha.txt"
          printf '%s\n' "$MCP_SHA" > "$RESULT_ROOT/mcp-sha.txt"

      - name: Configure standard TraceCite MCP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_ROOT/.pi"
          cat > "$SOURCE_ROOT/.mcp.json" <<EOF
          {
            "mcpServers": {
              "tracecite": {
                "command": "python",
                "args": ["-m", "tracecite_mcp.server"],
                "env": {
                  "TRACECITE_MCP_ALLOWED_ROOTS": "$WORK_ROOT/evidence",
                  "TRACECITE_MCP_STATE_DIR": "$RESULT_ROOT/tracecite-mcp-state"
                }
              }
            }
          }
          EOF
          cat > "$SOURCE_ROOT/.pi/mcp.json" <<'EOF'
          {
            "settings": {
              "disableProxyTool": true
            },
            "mcpServers": {
              "tracecite": {
                "directTools": true,
                "toolPrefix": "none",
                "lifecycle": "eager"
              }
            }
          }
          EOF

      - name: Run paired Native vs TraceCite MCP investigation
        shell: bash
        run: |
          set -euo pipefail
          QUESTION="$(cat "$QUESTION_FILE")"
          BASE_PROMPT="You are a real coding agent debugging a failure with a complete pre-fix source repository as your current working directory. The source tree is fixed to the bug-producing pre-fix commit; do not use the web, issue/PR content, remote git operations, or post-fix knowledge. A failing runtime log is available at $RUNTIME_LOG. You own hypotheses, causal reasoning, source-code exploration, investigation order, conclusions, evidence sufficiency, and when to stop. You may freely explore the checked-out source code with read, grep, bash, find, and ls. Cite important claims as exact runtime-log or source path:L<line> references you actually observed. Distinguish direct observation from inference."

          run_arm() {
            arm="$1"
            mkdir -p "$RESULT_ROOT/pi-${arm}-session"
            cd "$SOURCE_ROOT"
            set +e
            if [[ "$arm" == native ]]; then
              NATIVE_PROMPT="$BASE_PROMPT This is the native runtime-log arm. You may inspect the runtime log with the same native read/grep/bash tools you use for source code."
              timeout -k 30s 1200s pi \
                --provider gmi --model "$BENCH_MODEL" --api-key "$OPENAI_API_KEY" \
                --thinking off --mode text --print \
                --session-dir "$RESULT_ROOT/pi-native-session" \
                --tools read,bash,grep,find,ls \
                --no-extensions --no-skills --no-prompt-templates --no-context-files \
                --system-prompt "$NATIVE_PROMPT" "$QUESTION" \
                > "$RESULT_ROOT/pi-native-answer.md" 2> "$RESULT_ROOT/pi-native-stderr.log"
            else
              TRACE_PROMPT="$BASE_PROMPT This is the TraceCite MCP runtime-log arm. Native read/grep/bash/find/ls remain available for source-code exploration, but EVERY operation that inspects or derives from runtime-log content MUST use the standard TraceCite MCP tools. The benchmark Host blocks native content access outside the pre-fix source tree. Follow the TraceCite Agent Skill for evidence handling. You still own all hypotheses, causal reasoning, evidence sufficiency, and stopping decisions."
              TRACECITE_HOST_ACTIVITY="$RESULT_ROOT/tracecite-host-tool-activity.json" \
              TRACECITE_LOG_GUARD_ACTIVITY="$RESULT_ROOT/tracecite-log-guard-blocks.jsonl" \
              TRACECITE_LOG_ACCESS_ACTIVITY="$RESULT_ROOT/tracecite-runtime-log-access.jsonl" \
              TRACECITE_CODE_ROOT="$SOURCE_ROOT" \
              TRACECITE_RUNTIME_LOG="$RUNTIME_LOG" \
              timeout -k 30s 1200s pi \
                --provider gmi --model "$BENCH_MODEL" --api-key "$OPENAI_API_KEY" \
                --thinking off --mode text --print \
                --session-dir "$RESULT_ROOT/pi-tracecite-session" \
                --extension "$GITHUB_WORKSPACE/core/benchmarks/agent-investigation/pi_log_code_benchmark_host.ts" \
                --tools read,bash,grep,find,ls,tracecite_retrieve,tracecite_materialize,tracecite_replay,tracecite_aggregate,tracecite_traverse,tracecite_verify \
                --no-skills --skill "$GITHUB_WORKSPACE/skills/tracecite/SKILL.md" \
                --no-prompt-templates --no-context-files \
                --system-prompt "$TRACE_PROMPT" "$QUESTION" \
                > "$RESULT_ROOT/pi-tracecite-answer.md" 2> "$RESULT_ROOT/pi-tracecite-stderr.log"
            fi
            code=$?
            set -e
            echo "$code" > "$RESULT_ROOT/pi-${arm}-exit.txt"
          }

          echo "$ARM_ORDER" > "$RESULT_ROOT/arm-order.txt"
          first="${ARM_ORDER%% *}"
          second="${ARM_ORDER##* }"
          run_arm "$first"
          sleep 5
          run_arm "$second"

      - name: Convert and evaluate answers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for arm in native tracecite; do
            SESSION="$(find "$RESULT_ROOT/pi-${arm}-session" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
            ANSWER="$RESULT_ROOT/pi-${arm}-answer.md"
            EXIT="$RESULT_ROOT/pi-${arm}-exit.txt"
            if [[ -z "$SESSION" || ! -f "$ANSWER" || ! -f "$EXIT" ]]; then
              continue
            fi
            TRANSCRIPT="$RESULT_ROOT/pi-${arm}-transcript.jsonl"
            SCORE="$RESULT_ROOT/pi-${arm}-score.json"
            RUN_RESULT="$RESULT_ROOT/pi-${arm}-run-result.json"
            python core/benchmarks/agent-investigation/pi_session_to_transcript.py \
              "$SESSION" "$ANSWER" "$TRANSCRIPT" \
              --mode "pi-log-code-${arm}" --model "$BENCH_MODEL"
            python core/benchmarks/agent-investigation/log_code_score.py \
              "$CASE_DIR" "$TRANSCRIPT" > "$SCORE" || true
            if [[ -f "$SCORE" ]]; then
              python core/benchmarks/agent-investigation/run_result.py \
                --score "$SCORE" \
                --exit-code-file "$EXIT" \
                --stderr "$RESULT_ROOT/pi-${arm}-stderr.log" \
                --session "$SESSION" \
                --transcript "$TRANSCRIPT" \
                --output "$RUN_RESULT" || true
            fi
          done

      - name: Summarize primary Native vs TraceCite MCP comparison
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_ROOT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RESULT_ROOT'])
          def read(name):
              path = root / name
              return json.loads(path.read_text()) if path.is_file() else None
          def read_jsonl(name):
              path = root / name
              rows = []
              if path.is_file():
                  for line in path.read_text().splitlines():
                      if line.strip(): rows.append(json.loads(line))
              return rows
          def valid(value):
              return bool(value and (value.get('run_validity') or {}).get('valid_for_comparison'))
          def primary(value):
              if not value: return None
              evaluation = ((value.get('task_result') or {}).get('primary_evaluation') or {})
              tokens = value.get('token_usage') or {}
              validity = value.get('run_validity') or {}
              return {
                  'valid_for_comparison': bool(validity.get('valid_for_comparison')),
                  'validity_reason': validity.get('reason'),
                  'root_cause_accurate': evaluation.get('root_cause_accurate'),
                  'evidence_chain_complete_and_bounded': evaluation.get('evidence_chain_complete_and_bounded'),
                  'evidence_boundary_respected': evaluation.get('evidence_boundary_respected'),
                  'fresh_input_tokens': tokens.get('fresh_input_tokens'),
                  'cached_input_tokens': tokens.get('cached_input_tokens'),
                  'fresh_plus_cached_input_tokens': tokens.get('fresh_plus_cached_input_tokens'),
                  'output_tokens': tokens.get('output_tokens'),
                  'model_calls': tokens.get('model_calls'),
              }
          def token_delta(native_value, tracecite_value):
              if not isinstance(native_value, int) or not isinstance(tracecite_value, int): return None
              return {
                  'native': native_value,
                  'tracecite': tracecite_value,
                  'tracecite_minus_native': tracecite_value - native_value,
                  'tracecite_reduction_pct': round((native_value - tracecite_value) / native_value * 100, 1) if native_value > 0 else None,
              }
          native = read('pi-native-run-result.json')
          tracecite = read('pi-tracecite-run-result.json')
          activity = read('tracecite-host-tool-activity.json')
          blocked = read_jsonl('tracecite-log-guard-blocks.jsonl')
          runtime_log_access = read_jsonl('tracecite-runtime-log-access.jsonl')
          native_primary = primary(native)
          tracecite_primary = primary(tracecite)
          clean_pair = valid(native) and valid(tracecite) and bool(runtime_log_access)
          token_comparison = None
          if clean_pair and native_primary and tracecite_primary:
              token_comparison = {
                  key: token_delta(native_primary.get(key), tracecite_primary.get(key))
                  for key in ('fresh_input_tokens', 'cached_input_tokens', 'fresh_plus_cached_input_tokens', 'output_tokens')
              }
          report = {
              'schema_version': 1,
              'case_id': os.environ['CASE_ID'],
              'integration': 'Agent -> standard tracecite-mcp -> checked-out tracecite-core',
              'core_ref_requested': os.environ.get('CORE_REF'),
              'core_sha': os.environ.get('CORE_SHA'),
              'mcp_sha': os.environ.get('MCP_SHA'),
              'primary_comparison': {
                  'clean_pair': clean_pair,
                  'native': native_primary,
                  'tracecite': tracecite_primary,
                  'token_comparison': token_comparison,
              },
              'tracecite_runtime_log_used': bool(runtime_log_access),
              'tracecite_runtime_log_access': runtime_log_access,
              'blocked_native_log_attempts': blocked,
              'tracecite_host_activity': activity,
              'experimental_contract': {
                  'product_layer': 'tracecite-core + tracecite-mcp; MCP exposes mechanical evidence facts only',
                  'agent_layer': 'one generic TraceCite Skill; Agent owns hypothesis, causal reasoning, sufficiency, and stopping',
                  'benchmark_layer': 'Core benchmark Host adapter owns guard, telemetry, transcript normalization, evaluation, and token accounting',
              },
          }
          (root / 'comparison.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Upload A/B artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-native-vs-mcp-${{ matrix.case_id }}-r1
          path: ${{ env.RESULT_ROOT }}
          if-no-files-found: warn
