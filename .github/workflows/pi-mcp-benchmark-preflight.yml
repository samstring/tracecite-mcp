name: Pi Standard MCP Benchmark Preflight

on:
  push:
    branches: [feature_for_agent]
  pull_request:
    branches: [feature_for_agent]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout TraceCite MCP
        uses: actions/checkout@v4

      - name: Checkout TraceCite Core feature branch
        uses: actions/checkout@v4
        with:
          repository: samstring/tracecite-core
          ref: feature_for_agent
          path: core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Initialize runtime paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi-agent"
            echo "CASE_DIR=$GITHUB_WORKSPACE/core/benchmarks/agent-investigation/scale-cases/kubernetes-140039-runc-5347"
            echo "PREP=$RUNNER_TEMP/pi-mcp-benchmark/prepared"
            echo "RESULT=$RUNNER_TEMP/pi-mcp-benchmark/result"
          } >> "$GITHUB_ENV"

      - name: Install Core, MCP, Pi, and MCP adapter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          (cd core && python -m pip install -e ".[dev]")
          python -m pip install -e ".[dev]"
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          mkdir -p "$PI_CODING_AGENT_DIR"
          pi install npm:pi-mcp-adapter@2.27.0 --approve
          pi --version
          pi list

      - name: Verify Core benchmark contracts
        shell: bash
        run: |
          set -euo pipefail
          cd core
          python -m pytest -q \
            tests/test_canonical_evidence_contract.py \
            tests/test_runtime_session_retrieval.py \
            tests/test_session_novelty_regressions.py \
            tests/test_pi_session_to_transcript.py \
            tests/test_root_cause_benchmarking.py \
            tests/test_benchmark_run_result.py
          python scripts/check_architecture.py

      - name: Prepare real benchmark case
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PREP" "$RESULT"
          mkdir -p "$PREP" "$RESULT"
          python -m tracecite.root_cause_benchmarking validate "$CASE_DIR" > "$RESULT/validate.json"
          python -m tracecite.root_cause_benchmarking prepare "$CASE_DIR" --work-dir "$PREP" > "$RESULT/prepare.json"
          PREPARED="$(find "$PREP" -name prepared.json -type f -print -quit)"
          test -n "$PREPARED"
          python - "$PREPARED" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          inputs = data.get('inputs') or []
          if len(inputs) != 1:
              raise SystemExit(f'expected one prepared benchmark input, got {len(inputs)}')
          source = Path(inputs[0]['path']).resolve()
          print(f'INPUT_ROOT={source.parent}')
          print(f'INPUT_FILE={source.name}')
          print(f'INPUT_SOURCE={source}')
          print(f'QUESTION_FILE={Path(data["question"]).resolve()}')
          PY

      - name: Configure Pi direct canonical MCP tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$INPUT_ROOT/.pi"
          cat > "$INPUT_ROOT/.mcp.json" <<EOF
          {
            "mcpServers": {
              "tracecite": {
                "command": "python",
                "args": ["-m", "tracecite_mcp.server"],
                "env": {
                  "TRACECITE_MCP_ALLOWED_ROOTS": "$INPUT_ROOT",
                  "TRACECITE_MCP_STATE_DIR": "$RESULT/tracecite-state"
                }
              }
            }
          }
          EOF

          cat > "$INPUT_ROOT/.pi/mcp.json" <<'EOF'
          {
            "settings": {
              "disableProxyTool": true
            },
            "mcpServers": {
              "tracecite": {
                "directTools": true,
                "toolPrefix": "none",
                "lifecycle": "eager"
              }
            }
          }
          EOF

      - name: Run deterministic Pi Agent on prepared benchmark evidence
        shell: bash
        run: |
          set -euo pipefail
          PORT_FILE="$RESULT/fake-openai.port"
          REQUEST_LOG="$RESULT/fake-openai.requests.jsonl"
          ANSWER="$RESULT/pi-answer.md"
          SESSION_DIR="$RESULT/pi-session"
          TRANSCRIPT="$RESULT/pi-transcript.jsonl"

          python scripts/pi_mcp_benchmark_preflight_model.py \
            "$INPUT_SOURCE" "$PORT_FILE" "$REQUEST_LOG" &
          FAKE_PID=$!
          trap 'kill "$FAKE_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            [[ -s "$PORT_FILE" ]] && break
            sleep 0.1
          done
          test -s "$PORT_FILE"
          PORT="$(cat "$PORT_FILE")"

          python - "$PI_CODING_AGENT_DIR/models.json" "$PORT" <<'PY'
          import json, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          port = sys.argv[2]
          payload = {
              "providers": {
                  "smoke": {
                      "name": "Smoke",
                      "baseUrl": f"http://127.0.0.1:{port}/v1",
                      "api": "openai-completions",
                      "compat": {
                          "supportsDeveloperRole": False,
                          "supportsReasoningEffort": False,
                          "supportsUsageInStreaming": False,
                      },
                      "models": [
                          {
                              "id": "smoke-model",
                              "name": "Smoke Model",
                              "reasoning": False,
                              "input": ["text"],
                              "cost": {"input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0},
                              "contextWindow": 100000,
                              "maxTokens": 4096
                          }
                      ]
                  }
              }
          }
          out.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

          QUESTION="$(cat "$QUESTION_FILE")"
          cd "$INPUT_ROOT"
          pi \
            --provider smoke --model smoke-model --api-key smoke \
            --thinking off --mode text --print --approve \
            --session-dir "$SESSION_DIR" \
            --tools tracecite_retrieve,tracecite_materialize,tracecite_replay,tracecite_aggregate,tracecite_traverse,tracecite_verify \
            --no-skills --no-prompt-templates --no-context-files \
            "$QUESTION" \
            > "$ANSWER"

          grep -q 'PI_MCP_BENCHMARK_PREFLIGHT_OK' "$ANSWER"
          SESSION="$(find "$SESSION_DIR" -type f -name '*.jsonl' -print -quit)"
          test -n "$SESSION"
          cd "$GITHUB_WORKSPACE"
          python core/benchmarks/agent-investigation/pi_session_to_transcript.py \
            "$SESSION" "$ANSWER" "$TRANSCRIPT" \
            --mode pi-mcp-preflight --model smoke-model

      - name: Validate benchmark plumbing
        shell: bash
        run: |
          set -euo pipefail
          python - "$RESULT/fake-openai.requests.jsonl" "$RESULT/pi-transcript.jsonl" "$INPUT_FILE" "$RESULT/tracecite-state" <<'PY'
          import json, sys
          from pathlib import Path

          requests_path = Path(sys.argv[1])
          transcript_path = Path(sys.argv[2])
          input_file = sys.argv[3]
          state_root = Path(sys.argv[4])

          requests = [json.loads(line) for line in requests_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          if len(requests) < 2:
              raise SystemExit(f'expected at least two Pi model requests, got {len(requests)}')
          advertised = {
              ((tool.get('function') or {}).get('name'))
              for tool in (requests[0].get('tools') or [])
              if isinstance(tool, dict)
          }
          expected = {
              'tracecite_retrieve', 'tracecite_materialize', 'tracecite_replay',
              'tracecite_aggregate', 'tracecite_traverse', 'tracecite_verify'
          }
          if advertised != expected:
              raise SystemExit(f'direct benchmark tool surface mismatch: {advertised}')

          tool_messages = [
              message for message in (requests[-1].get('messages') or [])
              if isinstance(message, dict) and message.get('role') == 'tool'
          ]
          if not tool_messages:
              raise SystemExit('Pi benchmark loop did not return a tool result to the model')
          tool_payload = json.dumps(tool_messages, ensure_ascii=False, sort_keys=True)
          if input_file not in tool_payload or 'evidence' not in tool_payload:
              raise SystemExit('TraceCite result is not bound to the prepared benchmark evidence file')

          events = [json.loads(line) for line in transcript_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          tools = [event for event in events if event.get('type') == 'tool']
          if not any(event.get('name') == 'tracecite_retrieve' for event in tools):
              raise SystemExit(f'converted benchmark transcript lost TraceCite tool identity: {tools}')
          finals = [event for event in events if event.get('type') == 'final']
          if not finals or 'PI_MCP_BENCHMARK_PREFLIGHT_OK' not in finals[-1].get('answer', ''):
              raise SystemExit('converted benchmark transcript lost final answer')

          session_files = list((state_root / '_retrieval_sessions').glob('*.json'))
          if not session_files:
              raise SystemExit('MCP benchmark path did not persist RetrievalSession state')

          print(json.dumps({
              'status': 'ok',
              'mode': 'pi-standard-mcp-preflight',
              'input_file': input_file,
              'tracecite_tool_events': len(tools),
              'retrieval_session_files': len(session_files),
          }, sort_keys=True))
          PY

      - name: Upload preflight artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-standard-mcp-benchmark-preflight
          path: ${{ env.RESULT }}
          if-no-files-found: warn
